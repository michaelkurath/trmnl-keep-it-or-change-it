---
name: Keep It or Change It
strategy: polling
refresh_interval: 15
polling_url: "{{ base_url }}/api/state"
polling_verb: GET
custom_fields:
  - keyname: base_url
    field_type: string
    name: Game server URL
    description: Public HTTPS address of the shared game, without a trailing slash. The private preview cannot be polled by TRMNL.
    placeholder: https://your-game.example.com
